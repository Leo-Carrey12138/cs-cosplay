name: cs_cosplay
description: "纯软件真人 CS 对战：摄像头 + 本地 ML Kit 目标检测 + Firebase 房间。Android only。"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- 相机 ----
  camera: ^0.10.5+9

  # ---- 本地 AI（全部使用系统内置基础模型，不打包任何 .tflite 大文件）----
  google_mlkit_commons: ^0.13.0
  google_mlkit_object_detection: ^0.17.1
  google_mlkit_image_labeling: ^0.16.1

  # ---- 实时网络 ----
  # 用区间而不是固定小版本：让 pub 自动挑一组互相兼容的 firebase_* 版本，
  # 避免 Firebase SDK 大版本升级时锁死。若解析失败见《部署清单》第 7 步。
  firebase_core: ">=3.6.0 <5.0.0"
  firebase_database: ">=11.0.0 <13.0.0"

  # ---- 状态管理 / 反馈 ----
  provider: ^6.1.2
  vibration: ^3.2.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
